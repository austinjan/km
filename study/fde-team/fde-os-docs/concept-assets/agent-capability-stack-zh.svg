<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent 能力堆疊</title>
  <desc id="desc">Agent 能力由模型、上下文、工具、驗證、人工審批與營運控制共同構成。</desc>
  <rect width="520" height="360" rx="18" fill="#f8faf8"/>
  <g font-family="system-ui, sans-serif">
    <rect x="94" y="268" width="332" height="44" rx="12" fill="#20342b"/>
    <text x="260" y="297" text-anchor="middle" font-size="18" font-weight="900" fill="#bfe6cd">營運控制</text>
    <rect x="82" y="214" width="356" height="44" rx="12" fill="#6b5aa6"/>
    <text x="260" y="243" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">人工審批 + 防護欄</text>
    <rect x="70" y="160" width="380" height="44" rx="12" fill="#a26724"/>
    <text x="260" y="189" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">評測 + 追蹤 + 失敗分類</text>
    <rect x="58" y="106" width="404" height="44" rx="12" fill="#1f7a57"/>
    <text x="260" y="135" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">工具 + MCP + 函式呼叫</text>
    <rect x="46" y="52" width="428" height="44" rx="12" fill="#2867a2"/>
    <text x="260" y="81" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">上下文工程 + 模型</text>
  </g>
  <path d="M468 74c24 47 24 169 0 216" fill="none" stroke="#a33f3f" stroke-width="5" stroke-linecap="round"/>
  <text x="490" y="165" text-anchor="middle" transform="rotate(90 490 165)" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#a33f3f">可靠度來自整個系統</text>
</svg>
