<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent capability stack</title>
  <desc id="desc">Agent capability comes from model, context, tools, evals, human approval, and operating controls together.</desc>
  <rect width="520" height="360" rx="18" fill="#f8faf8"/>
  <g font-family="system-ui, sans-serif">
    <rect x="94" y="268" width="332" height="44" rx="12" fill="#20342b"/>
    <text x="260" y="297" text-anchor="middle" font-size="18" font-weight="900" fill="#bfe6cd">Operating Control</text>
    <rect x="82" y="214" width="356" height="44" rx="12" fill="#6b5aa6"/>
    <text x="260" y="243" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Human Approval + Guardrails</text>
    <rect x="70" y="160" width="380" height="44" rx="12" fill="#a26724"/>
    <text x="260" y="189" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Eval + Trace + Failure Taxonomy</text>
    <rect x="58" y="106" width="404" height="44" rx="12" fill="#1f7a57"/>
    <text x="260" y="135" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Tools + MCP + Function Calling</text>
    <rect x="46" y="52" width="428" height="44" rx="12" fill="#2867a2"/>
    <text x="260" y="81" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">Context Engineering + Model</text>
  </g>
  <path d="M468 74c24 47 24 169 0 216" fill="none" stroke="#a33f3f" stroke-width="5" stroke-linecap="round"/>
  <text x="490" y="156" text-anchor="middle" transform="rotate(90 490 156)" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#a33f3f">reliability is systemic</text>
</svg>
