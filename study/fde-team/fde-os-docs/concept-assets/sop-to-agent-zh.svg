<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">SOP 到 Agent 工作流</title>
  <desc id="desc">人工 SOP 轉成技能或模板，再成熟為可運行的 Agent 工作流。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6f8277"/>
    </marker>
  </defs>
  <rect width="520" height="360" rx="18" fill="#f8faf8"/>
  <path d="M137 182h92M293 182h92" stroke="#6f8277" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="40" y="110" width="115" height="144" rx="18" fill="#ffffff" stroke="#d8e2dc" stroke-width="2"/>
    <circle cx="98" cy="146" r="24" fill="#2867a2"/>
    <path d="M87 146h22M90 156h16M91 136h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="98" y="198" font-size="20" font-weight="900" fill="#17211c">人工 SOP</text>
    <text x="98" y="225" font-size="14" fill="#5f6f65">判斷 例外</text>
    <text x="98" y="245" font-size="14" fill="#5f6f65">交接 責任</text>
    <rect x="202" y="110" width="115" height="144" rx="18" fill="#ffffff" stroke="#d8e2dc" stroke-width="2"/>
    <circle cx="260" cy="146" r="24" fill="#1f7a57"/>
    <path d="M248 139h24M248 149h24M248 159h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="260" y="198" font-size="20" font-weight="900" fill="#17211c">技能</text>
    <text x="260" y="225" font-size="14" fill="#5f6f65">模板 規則</text>
    <text x="260" y="245" font-size="14" fill="#5f6f65">評測 備援</text>
    <rect x="365" y="110" width="115" height="144" rx="18" fill="#ffffff" stroke="#d8e2dc" stroke-width="2"/>
    <circle cx="422" cy="146" r="24" fill="#a26724"/>
    <path d="M414 137h16v18h-16zM418 130v7M409 156h26" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="422" y="198" font-size="20" font-weight="900" fill="#17211c">Agent 工作流</text>
    <text x="422" y="225" font-size="14" fill="#5f6f65">工具 權限</text>
    <text x="422" y="245" font-size="14" fill="#5f6f65">監控 審批</text>
  </g>
  <rect x="91" y="290" width="338" height="42" rx="21" fill="#20342b"/>
  <text x="260" y="317" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#bfe6cd">FDE 的工作是成熟化，不是直接自動化</text>
</svg>
