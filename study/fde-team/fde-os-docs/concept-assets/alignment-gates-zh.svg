<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">進場對齊關卡</title>
  <desc id="desc">FDE 進場前需確認人、料、權、靶四個關卡。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6f8277"/>
    </marker>
  </defs>
  <rect width="520" height="360" rx="18" fill="#f8faf8"/>
  <rect x="66" y="150" width="388" height="58" rx="29" fill="#eef4ef" stroke="#d8e2dc" stroke-width="2"/>
  <path d="M105 179h310" stroke="#6f8277" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="102" cy="179" r="48" fill="#2867a2"/>
    <text x="102" y="171" font-size="30" font-weight="900" fill="#fff">人</text>
    <text x="102" y="204" font-size="14" fill="#fff">負責人 / UAT</text>
    <circle cx="208" cy="179" r="48" fill="#1f7a57"/>
    <text x="208" y="171" font-size="30" font-weight="900" fill="#fff">料</text>
    <text x="208" y="204" font-size="14" fill="#fff">樣本 / 沙盒</text>
    <circle cx="314" cy="179" r="48" fill="#6b5aa6"/>
    <text x="314" y="171" font-size="30" font-weight="900" fill="#fff">權</text>
    <text x="314" y="204" font-size="14" fill="#fff">權限 / 人審</text>
    <circle cx="420" cy="179" r="48" fill="#a26724"/>
    <text x="420" y="171" font-size="30" font-weight="900" fill="#fff">靶</text>
    <text x="420" y="204" font-size="14" fill="#fff">指標 / 目標</text>
  </g>
  <rect x="122" y="270" width="276" height="54" rx="16" fill="#20342b"/>
  <text x="260" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#bfe6cd">全部確認才進場</text>
  <text x="260" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#fff">缺一項就修正或暫停</text>
  <text x="260" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#17211c">避免把 AI 願望包成原型案</text>
</svg>
